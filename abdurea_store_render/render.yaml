services:
  - type: web
    name: abdurea-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "5000"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM
        value: "@trust994"
      - key: TELEBIRR_PHONE
        value: "0992558519"
      - key: CBE_ACCOUNT
        value: "1000572238575"
